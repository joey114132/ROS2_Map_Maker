<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS 2 Map Maker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <header>
        <div class="header-top">
            <div class="logo">
                <span class="icon">🗺️</span>
                <h1>ROS 2 Map Maker</h1>
            </div>
            <div class="actions">
                <input type="file" id="import-pgm" accept=".pgm" style="display: none;">
                <button id="import-btn" class="premium-btn" onclick="document.getElementById('import-pgm').click()">📥 Import PGM</button>
                <button id="export-nav2" class="premium-btn">📋 Export Nav2 (PGM/YAML)</button>
                <button id="export-gazebo" class="premium-btn">🐢 Export Gazebo (SDF)</button>
            </div>
        </div>
        <div class="header-bottom">
            <div class="toolbar">
                <button id="tool-wall" class="active" title="Draw Wall (W)">🧱 Wall</button>
                <button id="tool-box" title="Draw Box (B)">📦 Box</button>
                <button id="tool-cylinder" title="Draw Cylinder (C)">🔋 Cyl</button>
                <div class="divider"></div>
                <div class="tool-group">
                    <button id="tool-pen" title="Draw Pixel (P)">🖊️ Pen</button>
                    <input type="color" id="pen-color" value="#ffffff" title="Pen Color">
                </div>
                <button id="tool-select" title="Select (S)">🖱️ Select</button>
                <button id="tool-erase" title="Erase (E)">✂️ Erase</button>
                <div class="divider"></div>
                <button id="undo-btn" title="Undo (Ctrl+Z)">↩️ Undo</button>
                <button id="redo-btn" title="Redo (Ctrl+Y)">↪️ Redo</button>
            </div>
        </div>
    </header>

    <main>
        <aside class="sidebar">
            <section>
                <h3>Status</h3>
                <div id="status-msg">Ready</div>
                <div id="stats">
                    <p>Walls: <span id="wall-count">0</span></p>
                    <p>Origin: <span id="origin-pos">0, 0</span></p>
                </div>
            </section>
            <section>
                <h3>Grid & Resolution</h3>
                <div class="control-row">
                    <label>Resolution:</label>
                    <div class="input-group">
                        <input type="number" id="resolution" value="0.05" step="0.01" min="0.01">
                        <span>m/px</span>
                    </div>
                </div>
                <div class="control-row">
                    <label>Grid Size:</label>
                    <input type="number" id="grid-size" value="0.5" step="0.1" min="0.1">
                </div>
                <div class="control-row">
                    <label>Snap to Grid:</label>
                    <input type="checkbox" id="snap-toggle" checked>
                </div>
                <div class="control-row">
                    <label>Smart Align:</label>
                    <input type="checkbox" id="align-toggle" checked title="Snap to other wall points">
                </div>
            </section>
            <section class="shortcuts">
                <h3>Shortcuts</h3>
                <ul>
                    <li><span>W</span> Wall Tool</li>
                    <li><span>B</span> Box Tool</li>
                    <li><span>C</span> Cylinder Tool</li>
                    <li><span>P</span> Pen Tool</li>
                    <li><span>S</span> Select Tool</li>
                    <li><span>E</span> Erase Tool</li>
                     <li><span>Shift</span> Straighten</li>
                    <li><span>Del</span> Delete</li>
                    <li><span>Drag</span> Pan View</li>
                </ul>
            </section>
        </aside>

        <div id="canvas-container">
            <canvas id="map-canvas"></canvas>
            <div class="coordinates" id="coords-display">0.00m, 0.00m</div>
        </div>
    </main>

    <script src="exporter.js"></script>
    <script src="app.js"></script>
</body>
</html>
